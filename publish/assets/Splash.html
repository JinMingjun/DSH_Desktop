<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;height:100%;background:#101014}
  @media (prefers-color-scheme: light){ body{background:#f7f7f8} }
  #splash{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    opacity:0;animation:dsfadein .35s ease forwards;transition:opacity .25s ease}
  @keyframes dsfadein{to{opacity:1}}
  .spinner{width:20px;height:20px;border:2px solid rgba(86,134,254,.22);border-top-color:#5686FE;
    border-radius:50%;animation:dsspin .8s linear infinite}
  @keyframes dsspin{to{transform:rotate(360deg)}}
  .txt{font-size:15px;color:#9aa0aa;letter-spacing:.3px}
  @media (prefers-color-scheme: light){ .txt{color:#5a5f6a} }
</style></head><body>
  <div id="splash">
    <div class="spinner"></div>
    <div class="txt">Starting DeepSeek Harness…</div>
  </div>
</body></html>
